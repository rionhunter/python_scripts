name: Release artifacts

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-package:
    name: Build and package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: text_file_compiler

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Run tests
        run: |
          pip install -r requirements.txt
          pytest -q

      - name: Package (placeholder)
        run: |
          echo "Packaging step — add PyInstaller or other packager here"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: |
            text_file_compiler/dist/**
            text_file_compiler/build/**
            text_file_compiler/*.zip
            text_file_compiler/*.exe
            text_file_compiler/*.tar.gz
