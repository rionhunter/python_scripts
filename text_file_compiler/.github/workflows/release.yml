name: Release artifacts

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-package:
    name: Build and package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-build.txt ]; then pip install -r requirements-build.txt || true; fi

      - name: Run tests
        run: |
          python -m pip install -r requirements.txt || true
          pytest -q || true

      - name: Package (placeholder)
        run: |
          echo "Packaging step — add PyInstaller or other packager here"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: |
            dist/**
            build/**
            *.zip
            *.exe
            *.tar.gz
name: Build and upload release artifacts

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}
  release:
    types: [published]

jobs:
  build:
    name: Build artifacts
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: [3.11]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: Build with PyInstaller
      run: |
        pyinstaller --onefile main.py

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: text-file-compiler-${{ matrix.os }}
        path: dist/*
